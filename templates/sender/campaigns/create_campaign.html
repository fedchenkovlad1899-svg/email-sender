
{% extends "base.html" %}
{% load static %}
{% block title %}
Создание рассылки
{% endblock %}
{% block content %}

<div class="container mt-4">
    <div class="card shadow-sm">
        <div class="card-header">
            <h3 class="mb-0">Создание рассылки</h3>
        </div>
        <div class="card-body">
            <div class="mb-3">
                <label class="form-label">Название</label>
                <input id="title" type="text" class="form-control">
            </div>
            <div class="mb-3">
                <label class="form-label">Шаблон письма</label>
                <select id="template" class="form-select">
                    <option value="">Выберите шаблон</option>
                </select>
            </div>
            <div class="mb-3">
                <label class="form-label">Группа контактов</label>
                <select id="contact-group" class="form-select">
                    <option value="">Без группы</option>
                </select>
            </div>
            <div class="mb-3">
                <label class="form-label">Отдельные контакты</label>
                <div id="contact-list"></div>
            </div>
            <div class="mb-3">
                <label class="form-label">Дата и время отправки</label>
                <input
                    id="scheduled-at"
                    type="datetime-local"
                    class="form-control"
                >
            </div>
            <div
                id="campaign-error"
                class="alert alert-danger d-none"
            ></div>
            <button id="save-button" class="btn btn-success">Сохранить</button>
            <a href="{% url 'campaign' %}" class="btn btn-secondary">Отмена</a>
        </div>
    </div>
</div>


<script src="{% static 'js/campaign/create_campaign.js' %}"></script>

{% endblock %}
