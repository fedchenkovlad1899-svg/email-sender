{% extends "base.html" %}
{% load static %}
{% block title %}
Рассылки
{% endblock %}
{% block content %}

<div class="container mt-4">
    <h2 class="mb-3">Рассылки</h2>
    <div class="mb-3">
        <a href="{% url 'create_campaign' %}" class="btn btn-primary">Создать рассылку</a>
    </div>
    <div id="campaign-error" class="alert alert-danger d-none"></div>
     <div class="row mb-3">

        <div class="col-md-4">
            <input id="search-input" type="text" class="form-control" placeholder="Поиск по названию">
        </div>

        <div class="col-md-3">
            <select id="status-filter" class="form-select">
                <option value="">Все статусы</option>
                <option value="draft">Черновик</option>
                <option value="scheduled">Запланирована</option>
                <option value="processing">Отправляется</option>
                <option value="completed">Завершена</option>
                <option value="completed_with_errors">Завершена с ошибками</option>
                <option value="failed">Ошибка</option>
                <option value="canceled">Отменена</option>
            </select>
        </div>

        <div class="col-md-3">
            <select id="ordering" class="form-select">
                <option value="-created_at">Время создания↓</option>
                <option value="created_at">Время создания</option>
                <option value="title">Название А–Я</option>
                <option value="-title">Название Я–А</option>
                <option value="scheduled_at">Время отправки</option>
                <option value="-scheduled_at">Время отправки ↓</option>
            </select>
        </div>

        <div class="col-md-2">
            <button id="search-button" type="button" class="btn btn-primary">Найти</button>
            <button id="reset-button"  type="button" class="btn btn-secondary">Сбросить</button>
        </div>

    </div>
    <table class="table table-bordered table-hover">
        <thead>
            <tr>
                <th>Название</th>
                <th>Статус</th>
                <th>Запланировано</th>
                <th>Отправлено</th>
                <th>Ошибок</th>
                <th>Действия</th>
            </tr>
        </thead>
        <tbody id="campaign-list"></tbody>
    </table>
    <div class="d-flex justify-content-between mt-3">
            <button id="previous-button" type="button" class="btn btn-secondary" disabled>Назад</button>
            <span id="page-info" class="align-self-center"></span>
            <button id="next-button" type="button" class="btn btn-secondary" disabled>Вперёд</button>
        </div>
    </div>
</div>

<script src="{% static 'js/campaign/campaign_list.js' %}"></script>

{% endblock %}
