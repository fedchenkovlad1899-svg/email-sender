{% extends "base.html" %}
{% load static %}
{% block title %}
Изменить шаблон письма
{% endblock %}
{% block content %}

<div class="container mt-4">
    <div class="card shadow-sm">
        <div class="card-header">
            <h3 class="mb-0">
                Изменить шаблон письма
            </h3>
        </div>
        <div class="card-body">
            <input
                id="template-id"
                type="hidden"
                value="{{ template_id }}"
            >
            <div class="mb-3">
                <label class="form-label">Название</label>
                <input
                    id="title"
                    class="form-control"
                    type="text"
                >
            </div>
            <div class="mb-3">
                <label class="form-label">Тема письма</label>
                <input
                    id="subject"
                    class="form-control"
                    type="text"
                >
            </div>
            <div class="mb-3">
                <label class="form-label">Текст письма</label>
                <textarea
                    id="body"
                    rows="10"
                    class="form-control"
                ></textarea>
            </div>
            <div
                id="error"
                class="alert alert-danger d-none"
            ></div>
            <button class="btn btn-success" onclick="updateTemplate()">Сохранить</button>
            <a href="{% url 'message_template' %}" class="btn btn-secondary">Отмена</a>
        </div>
    </div>
</div>





<script src="{% static 'js/message/update_message_template.js' %}"></script>

{% endblock %}
