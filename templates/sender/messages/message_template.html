{% extends "base.html" %}
{% load static %}
{% block title %}
Шаблоны писем
{% endblock %}
{% block content %}

<div class="container mt-4">
    <h2 class="mb-3">Шаблоны писем</h2>
    <div class="mb-3">
        <a href="{% url 'create_message_template' %}" class="btn btn-primary">Добавить шаблон</a>
    </div>
    <div
        id="template-error"
        class="alert alert-danger d-none"
    ></div>
    <table class="table table-bordered table-hover">
        <thead>
            <tr>
                <th>Название</th>
                <th>Тема письма</th>
                <th>Дата создания</th>
                <th>Действия</th>
            </tr>
        </thead>
        <tbody id="template-list"></tbody>
    </table>
</div>





<script src="{% static 'js/message/message_template.js' %}"></script>

{% endblock %}
