{% extends "base.html" %}
{% load static %}
{% block title %}
Шаблоны писем
{% endblock %}
{% block content %}

<div class="container mt-4">
    <h2 class="mb-3">Шаблоны писем</h2>
    <div class="mb-3">
        <a href="{% url 'create_message_template' %}" class="btn btn-primary">Добавить шаблон</a>
    </div>
    <div
        id="template-error"
        class="alert alert-danger d-none"
    ></div>
    <div class="row mb-3">
    <div class="col-md-6">
        <input id="search-input" type="text" class="form-control" placeholder="Поиск по названию, теме или тексту">
    </div>

    <div class="col-md-3">
        <select id="ordering" class="form-select">
            <option value="title">Название А–Я</option>
            <option value="-title">Название Я–А</option>
            <option value="subject">Тема А–Я</option>
            <option value="-subject">Тема Я–А</option>
            <option value="-created_at">Сначала новые</option>
            <option value="created_at">Сначала старые</option>
        </select>
    </div>
    <div class="col-md-3">
        <button id="search-button" type="button" class="btn btn-primary">Найти</button>
        <button id="reset-button" type="button" class="btn btn-secondary">Сбросить</button>
    </div>

</div>
    <table class="table table-bordered table-hover">
        <thead>
            <tr>
                <th>Название</th>
                <th>Тема письма</th>
                <th>Дата создания</th>
                <th>Действия</th>
            </tr>
        </thead>
        <tbody id="template-list"></tbody>
    </table>
</div>
<div class="d-flex justify-content-between mt-3">
    <button id="previous-button" type="button" class="btn btn-secondary" disabled>Назад</button>
    <span id="page-info" class="align-self-center"></span>
    <button id="next-button" type="button" class="btn btn-secondary" disabled>Вперёд</button>
</div>



<script src="{% static 'js/message/message_template.js' %}"></script>

{% endblock %}
