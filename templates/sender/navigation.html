<nav class="navbar navbar-expand-lg bg-dark border-bottom border-body" data-bs-theme="dark" >
    <div class="container-fluid">




        <a class="navbar-brand fw-bold" href="{% url 'home' %}">📧 Mail Sender</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav">
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'campaign' %}">Рассылки</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'contact' %}">Контакты</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'message_template' %}">Письма</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'statistic' %}">Статистика</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'about' %}" >О проекте</a>
                </li>
            </ul>

            <ul id="guest-navigation" class="navbar-nav ms-auto">
                <li class="nav-item guest-link">
                    <a class="nav-link" href="{% url 'login_page' %}">Войти</a>
                </li>
                <li class="nav-item guest-link ">
                    <a class="nav-link" href="{% url 'register_page' %}">Регистрация</a>
                </li>
                <li class="nav-item user-link d-none align-items-center">
                    <a id="navbar-username" class="nav-link" href="{% url 'profile_page' %}">Мой профиль</a>
                </li>
                <li class="nav-item user-link d-none ">
                    <button id="logout-button" type="button" class="btn btn-outline-danger">Выйти</button>
                </li>
            </ul>
        </div>
    </div>
</nav>


<script>
    document.addEventListener("DOMContentLoaded", function() {
        const accessToken = localStorage.getItem("access");

        const guestLinks = document.querySelectorAll(".guest-link");
        const userLinks = document.querySelectorAll(".user-link");

        if (accessToken) {
            showUserNavigation();

            loadCurrentUser(accessToken);
        } else {
            showGuestNavigation();
        }

        const logoutButton = document.getElementById("logout-button");

        if (logoutButton) {
            logoutButton.addEventListener("click", logoutUser);
        }
    });


    function showUserNavigation() {
        const guestLinks = document.querySelectorAll(".guest-link");
        const userLinks = document.querySelectorAll(".user-link");

        guestLinks.forEach(function(element) {
            element.classList.add("d-none");
        });

        userLinks.forEach(function(element) {
            element.classList.remove("d-none");
        });
    }


    function showGuestNavigation() {
        const guestLinks = document.querySelectorAll(".guest-link");
        const userLinks = document.querySelectorAll(".user-link");

        guestLinks.forEach(function(element) {
            element.classList.remove("d-none");
        });

        userLinks.forEach(function(element) {
            element.classList.add("d-none");
        });
    }


    async function loadCurrentUser(accessToken) {
        try {
            const response = await fetch("/profile/", {
                method: "GET",
                headers: {
                    "Authorization": "Bearer " + accessToken
                }
            });

            if (!response.ok) {
                const errorData = await response.json();

                console.error(
                    "Ошибка получения профиля:",
                    response.status,
                    errorData
                );

                return;
            }

            const user = await response.json();

            const navbarUsername =
                document.getElementById("navbar-username");

            if (navbarUsername) {
                navbarUsername.textContent =
                    user.username ||
                    user.email ||
                    "Пользователь";
            }

        } catch (error) {
            console.error(
                "Ошибка запроса профиля:",
                error
            );
        }
    }


    async function logoutUser() {
        const accessToken =
            localStorage.getItem("access");

        const refreshToken =
            localStorage.getItem("refresh");

        if (!accessToken || !refreshToken) {
            clearTokens();
            window.location.href = "{% url 'home' %}";
            return;
        }

        try {
            const response = await fetch("/logout/", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "Authorization": "Bearer " + accessToken
                },
                body: JSON.stringify({
                    refresh: refreshToken
                })
            });

            let data = {};

            try {
                data = await response.json();
            } catch (error) {
                data = {};
            }

            if (!response.ok) {
                console.error(
                    "Ошибка выхода:",
                    response.status,
                    data
                );

                alert(
                    data.detail ||
                    "Сервер не выполнил выход."
                );

                return;
            }

            clearTokens();

            window.location.href = "{% url 'home' %}";

        } catch (error) {
            console.error(
                "Ошибка запроса выхода:",
                error
            );

            alert(
                "Не удалось отправить запрос выхода."
            );
        }
    }


    function clearTokens() {
        localStorage.removeItem("access");
        localStorage.removeItem("refresh");
    }
</script>
