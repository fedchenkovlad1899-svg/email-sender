{% extends "base.html" %}
{% load static %}

{% block content %}

<div class="container mt-4">
    <h2 class="mb-3">Статистика рассылок</h2>
    <div id="statistic-error" class="alert alert-danger d-none"></div>
    <div class="row mb-4">
        <div class="col-md-3">
            <div class="card shadow-sm text-center">
                <div class="card-body">
                    <h5>Всего писем</h5>
                    <h3 id="total-count">0</h3>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card shadow-sm text-center">
                <div class="card-body">
                    <h5>Отправлено</h5>
                    <h3 id="sent-count">0</h3>
                </div>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card shadow-sm text-center">
                <div class="card-body">
                    <h5>Ошибок</h5>
                    <h3 id="failed-count">0</h3>
                </div>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card shadow-sm text-center">
                <div class="card-body">
                    <h5>Ожидают</h5>
                    <h3 id="pending-count">0</h3>
                </div>
            </div>
        </div>
    </div>

    <h3 class="mb-3">История отправок</h3>
    <div class="row mb-3">
        <div class="col-md-6">
            <input id="search-input" type="text" class="form-control" placeholder="Email получателя или название рассылки">
        </div>

        <div class="col-md-3">
            <select id="status-filter" class="form-select">
                <option value="">Все статусы</option>
                <option value="sent">Отправлено</option>
                <option value="failed">Ошибка</option>
                <option value="pending">Ожидает отправки</option>
            </select>
        </div>

        <div class="col-md-3">
            <button id="search-button" type="button" class="btn btn-primary">Найти</button>

            <button id="reset-button" type="button" class="btn btn-secondary">Сбросить</button>
        </div>
    </div>

    <div class="table-responsive">
        <table class="table table-bordered table-hover">
            <thead>
                <tr>
                    <th>Рассылка</th>
                    <th>Получатель</th>
                    <th>Статус</th>
                    <th>Ошибка</th>
                    <th>Дата отправки</th>
                </tr>
            </thead>

            <tbody id="logs-list"></tbody>
        </table>
        <div class="d-flex justify-content-between mt-3">
            <button id="previous-button" type="button" class="btn btn-secondary" disabled>Назад</button>
            <span id="page-info" class="align-self-center"></span>
            <button id="next-button" type="button" class="btn btn-secondary" disabled>Вперёд</button>
        </div>
    </div>
</div>

<script src="{% static 'js/statistic.js' %}"></script>

{% endblock %}
