{% extends "base.html" %}
{% block title %}
    Профиль
{% endblock %}
{% block content %}

<div class="container mt-4">
    <div class="card shadow-sm">
        <div class="card-header">
            <h3 class="mb-0">Профиль пользователя</h3>
        </div>

        <div class="card-body">
            <div id="profile-content">
                <p>
                    <strong>Имя пользователя:</strong>
                    <span id="profile-username"></span>
                </p>
                <p>
                    <strong>Email:</strong>
                    <span id="profile-email"></span>
                </p>
                <p>
                    <strong>Имя:</strong>
                    <span id="profile-first-name"></span>
                </p>
                <p>
                    <strong>Фамилия:</strong>
                    <span id="profile-last-name"></span>
                </p>
                <p>
                    <strong>Роль:</strong>
                    <span id="profile-role"></span>
                </p>
                <p>
                    <strong>Статус:</strong>
                    <span id="profile-status"></span>
                </p>
                <p>
                    <strong>Дата регистрации:</strong>
                    <span id="profile-date-joined"></span>
                </p>
            </div>

            <div class="mt-3">
                <a href="{% url 'profile_update' %}" class="btn btn-primary">Изменить профиль</a>
                <a href="{% url 'change_password_page' %}" class="btn btn-primary">Сменить пароль</a>
            </div>

            <div
                id="profile-success"
                class="alert alert-success d-none mt-3"
            ></div>

            <div
                id="profile-error"
                class="alert alert-danger d-none mt-3"
            ></div>

        </div>
    </div>
</div>




<script>

    async function refreshAccessToken() {
        const refreshToken = localStorage.getItem("refresh");
        if (!refreshToken) {
            return null;
        }
        const response = await fetch("/token/refresh/", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                refresh: refreshToken
            })
        });

        if (!response.ok) {
            localStorage.removeItem("access");
            localStorage.removeItem("refresh");
            return null;
        }

        const data = await response.json();
        localStorage.setItem("access", data.access);
        return data.access;
    }

    async function getProfile(accessToken) {
        return fetch("/profile/", {
            method: "GET",
            headers: {"Authorization": "Bearer " + accessToken}
        });
    }

    document.addEventListener("DOMContentLoaded", async function () {
        let accessToken = localStorage.getItem("access");
        const contentElement = document.getElementById("profile-content");
        const errorElement = document.getElementById("profile-error");
        if (!accessToken) {
            window.location.href = "{% url 'login_page' %}";
            return;
        }
        try {
            let response = await getProfile(accessToken);
            if (response.status === 401) {
                accessToken = await refreshAccessToken();
                if (!accessToken) {
                    window.location.href = "{% url 'login_page' %}";
                    return;
                }
                response = await getProfile(accessToken);
            }
            if (!response.ok) {
                throw new Error("Не удалось получить данные профиля");
            }
            const user = await response.json();
            document.getElementById("profile-username").textContent = user.username || "Не указано";
            document.getElementById("profile-email").textContent = user.email || "Не указано";
            document.getElementById("profile-first-name").textContent = user.first_name || "Не указано";
            document.getElementById("profile-last-name").textContent = user.last_name || "Не указано";
            document.getElementById("profile-role").textContent = user.role || "Пользователь";
            document.getElementById("profile-status").textContent = user.is_active ? "Активен" : "Заблокирован";
            document.getElementById("profile-date-joined").textContent = user.date_joined ? new Date(user.date_joined).toLocaleString("ru-RU") : "Нет данных";
            contentElement.classList.remove("d-none");

        } catch (error) {
            errorElement.textContent = error.message;
            errorElement.classList.remove("d-none");
        }
    });
</script>

{% endblock %}
