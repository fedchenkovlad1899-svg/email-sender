{% extends "base.html" %}
{% load static %}
{% block title %}
Изменение контакта
{% endblock %}
{% block content %}

<div class="container mt-4">
    <div class="card shadow-sm">
        <div class="card-header">
            <h3 class="mb-0">Изменение контакта</h3>
        </div>
        <div class="card-body">
            <input
                id="contact-id"
                type="hidden"
                value="{{ contact_id }}"
            >
            <div class="mb-3">
                <label class="form-label">Имя</label>
                <input id="name" type="text" class="form-control">
            </div>
            <div class="mb-3">
                <label class="form-label">Email</label>
                <input id="email" type="email" class="form-control">
            </div>
            <div class="mb-3">
                <label class="form-label">Описание</label>
                <textarea
                    id="description"
                    class="form-control"
                    rows="3"
                ></textarea>
            </div>
            <div
                id="contact-error"
                class="alert alert-danger d-none"
            ></div>
            <button id="save-button" type="button" class="btn btn-success">Сохранить</button>
            <a href="{% url 'contact' %}" class="btn btn-secondary">Отмена</a>
        </div>
    </div>
</div>



<script src="{% static 'js/contact/update_contact.js' %}"></script>

{% endblock %}
