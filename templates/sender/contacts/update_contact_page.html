{% extends "base.html" %}
{% block title %}
Изменение контакта
{% endblock %}
{% block content %}

<div class="container mt-4">
    <div class="card shadow-sm">
        <div class="card-header">
            <h3 class="mb-0">Изменение контакта</h3>
        </div>
        <div class="card-body">
            <div class="mb-3">
                <label class="form-label">Имя</label>
                <input id="name" type="text" class="form-control">
            </div>
            <div class="mb-3">
                <label class="form-label">Email</label>
                <input id="email" type="email" class="form-control">
            </div>
            <div class="mb-3">
                <label class="form-label">Описание</label>
                <textarea
                    id="description"
                    class="form-control"
                    rows="3"
                ></textarea>
            </div>
            <div
                id="contact-error"
                class="alert alert-danger d-none"
            ></div>
            <button id="save-button" type="button" class="btn btn-success">Сохранить</button>
            <a href="{% url 'contact' %}" class="btn btn-secondary">Отмена</a>
        </div>
    </div>
</div>



<script>
document.addEventListener("DOMContentLoaded", async function () {
    const contactId = "{{ contact_id }}";
    const accessToken = localStorage.getItem("access");
    const response = await fetch(`/contacts/${contactId}/`, {
        headers: {
            "Authorization": "Bearer " + accessToken
        }
    });
    if (!response.ok) {
        document.getElementById("contact-error").textContent =
            "Не удалось загрузить контакт";
        document.getElementById("contact-error")
            .classList.remove("d-none");
        return;
    }
    const contact = await response.json();
    document.getElementById("name").value = contact.name || "";
    document.getElementById("email").value = contact.email || "";
    document.getElementById("description").value = contact.description || "";
    document.getElementById("save-button").addEventListener("click", async function () {
            const response = await fetch(`/contacts/${contactId}/update/`,
                {
                    method: "PATCH",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": "Bearer " + accessToken
                    },
                    body: JSON.stringify({
                        name: document.getElementById("name").value,
                        email: document.getElementById("email").value,
                        description:
                            document.getElementById("description").value
                    })
                }
            );
            if (response.ok) {
                window.location.href = "{% url 'contact' %}";
            } else {
                document.getElementById("contact-error").textContent =
                    "Не удалось изменить контакт";
                document.getElementById("contact-error")
                    .classList.remove("d-none");
            }
        });
});
</script>

{% endblock %}
