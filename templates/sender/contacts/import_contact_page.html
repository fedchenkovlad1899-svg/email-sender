{% extends "base.html" %}
{% load static %}
{% block title %}
Импорт контактов
{% endblock %}
{% block content %}

<div class="container mt-4">
    <div class="card shadow-sm">
        <div class="card-header">
            <h3 class="mb-0">Импорт контактов</h3>
        </div>
        <div class="card-body">
            <div class="mb-3">
                <label for="file" class="form-label">Файл CSV или XLSX</label>
                <input
                    id="file"
                    type="file"
                    class="form-control"
                    accept=".csv,.xlsx"
                >
            </div>
            <div class="mb-3">
                <label for="group" class="form-label">Группа</label>
                <select id="group" class="form-select">
                    <option value="">Без группы</option>
                </select>
            </div>
            <div
                id="import-success"
                class="alert alert-success d-none"
            ></div>
            <div
                id="import-error"
                class="alert alert-danger d-none"
            ></div>
            <button id="import-button" type="button" class="btn btn-success">Импортировать</button>
            <a href="{% url 'contact' %}" class="btn btn-secondary">Отмена</a>
        </div>
    </div>
</div>



<script src="{% static 'js/contact/import_contact.js' %}"></script>

{% endblock %}
