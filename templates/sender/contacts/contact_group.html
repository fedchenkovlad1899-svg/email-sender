{% extends "base.html" %}
{% load static %}
{% block title %}
Группы контактов
{% endblock %}
{% block content %}

<div class="container mt-4">
    <div class="card shadow-sm">
        <div class="card-header">
            <h3 class="mb-0">Группы контактов</h3>
        </div>
        <div class="card-body">
            <a href="{% url 'create_contact_group' %}" class="btn btn-success mb-3">Создать группу</a>
            <table class="table table-striped">
                <thead>
                    <tr>
                        <th>Название</th>
                        <th>Количество контактов</th>
                        <th>Действия</th>
                    </tr>
                </thead>
                <tbody id="group-list"></tbody>
            </table>
        </div>
    </div>
</div>


<script src="{% static 'js/contact/contact_group.js' %}"></script>

{% endblock %}
