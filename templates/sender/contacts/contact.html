{% extends "base.html" %}
{% load static %}
{% block title %}
Контакты
{% endblock %}
{% block content %}

<div class="container mt-4">
    <h2 class="mb-3">Контакты</h2>

    <div class="d-flex gap-2 mb-3">
        <a href="{% url 'create_contact_page' %}" class="btn btn-primary">Добавить контакт</a>
        <a href="{% url 'import_contact_page' %}" class="btn btn-primary">Импорт контактов</a>
        <a href="{% url 'contact_group' %}" class="btn btn-primary">Группы контактов</a>
    </div>

    <div id="contact-error" class="alert alert-danger d-none"></div>
    <div class="row mb-3">
    <div class="col-md-6">
        <input id="search-input" type="text" class="form-control" placeholder="Поиск по имени, email или описанию">
    </div>

    <div class="col-md-3">
        <select id="ordering" class="form-select">
            <option value="name">Имя А–Я</option>
            <option value="-name">Имя Я–А</option>
            <option value="-created_at">Сначала новые</option>
            <option value="created_at">Сначала старые</option>
        </select>
    </div>

    <div class="col-md-3">
        <button id="search-button" type="button" class="btn btn-primary">Найти</button>
        <button id="reset-button" type="button" class="btn btn-secondary">Сбросить</button>
    </div>

</div>

    <table class="table table-bordered">
        <thead>
            <tr>
                <th>Имя</th>
                <th>Email</th>
                <th>Описание</th>
                <th>Дата создания</th>
                <th>Действия</th>
            </tr>
        </thead>

        <tbody id="contact-list"></tbody>
    </table>
    <div class="d-flex justify-content-between mt-3">
    <button id="previous-button" type="button" class="btn btn-secondary" disabled>Назад</button>
    <span id="page-info" class="align-self-center"></span>
    <button id="next-button" type="button" class="btn btn-secondary" disabled>Вперёд</button>
    </div>
</div>


<script src="{% static 'js/contact/contact.js' %}"></script>

{% endblock %}
